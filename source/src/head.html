:root[data-theme="lavender"] {
  --bg: #F0E8FA; --panel: #F9F3FF; --panel2: #E4D8F5; --pasteboard: #D3C3E9; --line: #B8A8D6; --line2: #D7C9EB; --fg: #3F3159; --mut: #7E6A99; --accent: #8A63D2; --accent-fg: #FFFFFF; --accent-soft: #E3D4FF; --playhead: #F98FAD; --motion: #D6C4F8; --shape: #B8DEC8; --held: #E4D8F0; --cell: #FCF8FF; --cell5: #F0E8F8;
  --key: #3F3159; --danger: #C34B5A; --shadow: 0 8px 28px rgba(0,0,0,.22); color-scheme: light;
}
:root[data-theme="solar"] {
  --bg: #FFF6C7; --panel: #FFFCDF; --panel2: #F8EAA8; --pasteboard: #F4DF92; --line: #D6C46F; --line2: #F0DFAC; --fg: #544524; --mut: #8E7540; --accent: #E79D00; --accent-fg: #251A05; --accent-soft: #FFF0A0; --playhead: #FF705C; --motion: #F6DC84; --shape: #B1E5C8; --held: #E8DDAF; --cell: #FFFDEF; --cell5: #FFF4C7;
  --key: #544524; --danger: #C34B5A; --shadow: 0 8px 28px rgba(0,0,0,.22); color-scheme: light;
}
/* Yellow-only refinement: empty timeline area matches surrounding panels. */
:root[data-theme="cyberpunk"] .tl-scroll,
:root[data-theme="acid"] .tl-scroll { background: var(--panel); }
:root[data-theme="cyberpunk"] .tl-inner,
:root[data-theme="acid"] .tl-inner { background: var(--panel); }

#kThemeMenu{position:fixed;z-index:9999;right:10px;top:40px;width:254px;max-height:min(70vh,500px);overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:8px;display:none}
#kThemeMenu.open{display:block}
#kThemeMenu .k-theme-opt{width:100%;display:flex;align-items:center;gap:10px;padding:7px 9px;border:1px solid transparent;background:transparent;color:var(--fg);text-align:left;border-radius:6px;cursor:pointer}
#kThemeMenu .k-theme-opt:hover{background:var(--panel2)}
#kThemeMenu .k-theme-opt[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
#kThemeMenu .k-theme-dot{width:27px;height:17px;flex:none;border-radius:4px;border:1px solid var(--line)}
#kThemeMenu .k-theme-heading{font-size:11px;color:var(--mut);padding:8px 8px 3px;text-transform:uppercase;letter-spacing:.07em}

/* Bone controls live on the canvas, never in the property sidebar. */
.skel-selected #pane-obj > .sec { display:none; }
#boneMenu { position:absolute; width:1px; height:1px; pointer-events:none; z-index:8; }
body.bone-hud-hidden #boneMenu,body.bone-hud-hidden #boneAngle,body.bone-hud-hidden #boneAngleRemove,body.bone-hud-hidden #bonePoseGallery{visibility:hidden !important;pointer-events:none !important;}
#boneMenu[hidden], #boneMenu button[hidden] { display:none !important; }
#boneMenu button, :is(#boneAngle,#boneAngleRemove) { position:absolute; top:0; width:30px; height:30px; min-width:30px; padding:0; transform:translate(-50%,-50%); border:2px solid var(--fg); border-radius:50%; background:var(--panel); color:var(--fg); box-shadow:inset 0 0 0 3px var(--accent),0 1px 3px var(--pasteboard); font:bold 24px/24px system-ui,sans-serif; display:grid; place-items:center; pointer-events:auto; touch-action:none; cursor:pointer; }
#boneMenu button:hover, :is(#boneAngle,#boneAngleRemove):hover { background:var(--accent-soft); }
#boneMenu button:focus-visible, :is(#boneAngle,#boneAngleRemove):focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
#boneAdd { left:-36px; }
#boneRemove { left:36px; }
#bonePose { left:-38px; top:38px; }
#bonePhoto { left:-70px; top:-4px; }
#boneLibrary { left:-70px; top:34px; }
#bonePoseGallery {position:absolute;z-index:12;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;max-width:280px;max-height:210px;overflow:auto;padding:8px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);}
#bonePoseGallery[hidden]{display:none;}
.bone-pose-tile{position:relative;width:84px;height:84px;}
.bone-pose-image{width:84px;height:84px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--cell);color:var(--accent);position:relative;}
.bone-pose-number{position:absolute;left:4px;top:2px;color:var(--fg);font:12px sans-serif;}
.bone-pose-delete{position:absolute;right:2px;top:2px;width:18px;height:18px;padding:0;line-height:16px;border:0;border-radius:50%;background:var(--panel);color:var(--fg);}
#boneRigid { left:38px; top:-38px; }
#boneAttach { left:38px; top:38px; }
#bonePin { left:0; top:36px; }
#boneMenu button[aria-pressed="true"], #boneAngle[aria-pressed="true"] { background:color-mix(in srgb,var(--panel) 68%,#000); box-shadow:inset 0 0 0 3px var(--accent),0 0 0 2px var(--accent); }
#boneMode { left:0; top:-36px; }
:is(#boneAngle,#boneAngleRemove)[hidden] { display:none !important; }
:is(#boneAngle,#boneAngleRemove) { z-index:9; }
#boneMenu button svg, :is(#boneAngle,#boneAngleRemove) svg { width:20px; height:20px; display:block; margin:auto; pointer-events:none; }
</style>

<style>
#toast .toast-protest { background:var(--panel); color:color-mix(in srgb,var(--fg),var(--danger) var(--protest-red)); border:1px solid currentColor; font-size:var(--protest-size); max-width:min(480px,calc(100vw - 32px)); max-height:30vh; overflow:hidden; overflow-wrap:anywhere; text-align:center; line-height:1.25; }
#toast .toast-protest:not([data-level="0"]) { font-weight:700; }
</style>

<style>
#saveProjectName { display:block; width:100%; box-sizing:border-box; margin-top:8px; min-height:40px; font-size:16px; }
</style>

<style>
#crumb { flex-direction:column; align-items:flex-start; gap:4px; }
.crumb-path-row { display:flex; align-items:center; gap:8px; }
#crumbPreview { font-size:12px; }
#kColorLab .knone { color:var(--fg); background:linear-gradient(135deg,transparent 45%,#d32828 46%,#d32828 54%,transparent 55%),var(--cell); font-size:22px; line-height:20px; }
#kColorLab .knone[aria-pressed="true"] { box-shadow:inset 0 0 0 2px var(--accent); }
#kColorLab .knone:disabled { opacity:.35; cursor:default; }
</style>

<style>
#kSelectBar .karrange { min-width:22px; padding:0 5px; border:0; background:transparent; box-shadow:none; }
#kSelectBar .karrange:hover:not(:disabled) { background:var(--panel2); }
#kSelectBar .karrange:disabled { opacity:.35; cursor:default; }
</style>

<style>
#kSelectBar #bHiddenOutlines[hidden] { display:none; }
#kSelectBar #bHiddenOutlines[aria-pressed="true"] { background:var(--panel2); color:color-mix(in srgb,var(--fg) 50%,var(--panel)); }
</style>
